# ============================================================
# Supervisor — Worker de file d'attente (QUEUE_CONNECTION=database)
# ============================================================
# Emplacement habituel : /etc/supervisor/conf.d/mimosaflour-worker.conf
# Activation :
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start mimosaflour-worker:*
# ------------------------------------------------------------

[program:mimosaflour-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mimosaflour.com/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/mimosaflour.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/mimosaflour.com/storage/logs/worker.log
stopwaitsecs=3600
