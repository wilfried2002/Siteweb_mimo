# ============================================================
# Nginx server block — mimosaflour.com (VPS / serveur dédié)
# ============================================================
# Emplacement habituel : /etc/nginx/sites-available/mimosaflour.com
# Activation :
#   ln -s /etc/nginx/sites-available/mimosaflour.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adapter le chemin "fastcgi_pass" à la version de PHP-FPM installée.
# ------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name mimosaflour.com www.mimosaflour.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mimosaflour.com www.mimosaflour.com;

    root /var/www/mimosaflour.com/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/mimosaflour.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mimosaflour.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Empêcher l'accès aux fichiers sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    access_log /var/log/nginx/mimosaflour_access.log;
    error_log  /var/log/nginx/mimosaflour_error.log;
}
