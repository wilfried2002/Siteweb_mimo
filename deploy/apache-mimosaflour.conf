# ============================================================
# Apache VirtualHost — mimosaflour.com (VPS / serveur dédié)
# ============================================================
# Emplacement habituel : /etc/apache2/sites-available/mimosaflour.com.conf
# Activation :
#   a2ensite mimosaflour.com.conf
#   a2enmod rewrite ssl headers
#   systemctl reload apache2
#
# Le DocumentRoot DOIT pointer vers le dossier "public/" de Laravel,
# jamais vers la racine du projet.
# ------------------------------------------------------------

<VirtualHost *:80>
    ServerName mimosaflour.com
    ServerAlias www.mimosaflour.com

    # Redirection permanente vers HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName mimosaflour.com
    ServerAlias www.mimosaflour.com

    DocumentRoot /var/www/mimosaflour.com/public

    <Directory /var/www/mimosaflour.com/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Certificats SSL (Let's Encrypt via certbot)
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/mimosaflour.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/mimosaflour.com/privkey.pem

    # En-têtes de sécurité
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    # Limite d'upload (CV / lettres de motivation, images produits)
    LimitRequestBody 20971520

    ErrorLog ${APACHE_LOG_DIR}/mimosaflour_error.log
    CustomLog ${APACHE_LOG_DIR}/mimosaflour_access.log combined
</VirtualHost>
